name: Build custom installer

# 서명 키 없이 Windows 설치 파일을 만든다. main에 올릴 때마다, 또는 Actions 탭에서 직접 실행.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-custom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Checks added with the custom features
        run: |
          npm run check:account-status
          npm run check:inbox
          npm run check:ko-tags
          npm run check:character-bulk-delete
          npm run check:scene-i2i-cycle
          npm run check:scene-job-done
          npm run check:scene-overwrite
          npm run check:scene-webp-export
          npm run check:prompt-notes
          npm run check:translator
          npm run check:character-asset
          npm run check:work-log
          npm run check:scene-reservation
          npm run check:storage-names
          npm run check:seed-vault
          npm run check:web-split
          npm run check:censor-review
          npm run check:scene-loose-files
          npm run check:webp-anim
          npm run check:svg-studio
          npm run check:note-highlight
          npm run check:scene-preset-folders
          npm run check:shortcuts
          npm run check:installer-continuity

      - name: Native tests (inbox, folders)
        run: cargo test --manifest-path src-tauri/Cargo.toml _native

      - name: Build installer
        run: npm run tauri:build:local

      - uses: actions/upload-artifact@v4
        with:
          name: Nightmare-4-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # 로그인 없이 받을 수 있게 "latest" 릴리스에도 올린다 (공개 저장소):
      # https://github.com/jsj19293-debug/BRELL-nai/releases/latest/download/Nightmare-4-Setup.exe
      - name: Publish to the latest release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exe=$(ls src-tauri/target/release/bundle/nsis/*.exe | head -n1)
          cp "$exe" Nightmare-4-Setup.exe
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest --target "$GITHUB_SHA" --title "Nightmare 4 최신 빌드" --notes "main에 올릴 때마다 자동으로 갱신됩니다." --latest
          fi
          gh release upload latest Nightmare-4-Setup.exe --clobber
          gh release edit latest --notes "최신 빌드: ${GITHUB_SHA::7} · $(date -u '+%Y-%m-%d %H:%M') UTC"
