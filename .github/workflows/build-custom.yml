name: Build custom installer

# 서명 키 없이 Windows 설치 파일을 만든다. main에 올릴 때마다, 또는 Actions 탭에서 직접 실행.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-custom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Checks added with the custom features
        run: |
          npm run check:account-status
          npm run check:inbox
          npm run check:ko-tags
          npm run check:character-bulk-delete
          npm run check:scene-i2i-cycle
          npm run check:scene-webp-export
          npm run check:shortcuts
          npm run check:installer-continuity

      - name: Native tests (inbox, folders)
        run: cargo test --manifest-path src-tauri/Cargo.toml _native

      - name: Build installer
        run: npm run tauri:build:local

      - uses: actions/upload-artifact@v4
        with:
          name: NAIS2-RELL-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
