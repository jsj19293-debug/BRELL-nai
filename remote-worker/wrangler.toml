name = "nais2-forge-remote-web"
main = "src/index.js"
compatibility_date = "2026-09-25"
workers_dev = false
preview_urls = false

[[routes]]
pattern = "relay.ciyu.us"
custom_domain = true

[[routes]]
pattern = "ciyu.us/forge.web"
zone_name = "ciyu.us"

[vars]
WEB_ORIGIN = "https://ciyu.us"

[[ratelimits]]
name = "RELAY_CONNECT_LIMIT"
namespace_id = "62173"
simple = { limit = 120, period = 60 }

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RelayRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayRoom"]

[observability]
enabled = false
